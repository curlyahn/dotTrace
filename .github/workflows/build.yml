name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 태그 빌드 시 GitHub Release 만들기

env:
  # Dot 앱과 같은 서명 키의 SHA-1 (Google Cloud의 Maps API 키 제한에 등록)
  EXPECTED_SHA1: "12:8B:4E:D3:59:9E:8B:87:BC:0C:ED:64:C2:11:A8:8F:A8:24:9D:4D"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Maps API 키는 서명 키의 SHA-1로 앱을 알아보므로, 빌드마다 같은 키를 써야 한다.
      # Secret이 없으면 임시 키로 빌드만 하고(지도는 안 보일 수 있음) 경고를 남긴다.
      - name: Restore signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret이 없어 임시 서명 키로 빌드합니다."
            echo "SIGNED_WITH_DOT_KEY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dot.keystore"
          echo "DOT_KEYSTORE=$RUNNER_TEMP/dot.keystore" >> "$GITHUB_ENV"
          echo "SIGNED_WITH_DOT_KEY=true" >> "$GITHUB_ENV"

      - name: Check Maps API key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::warning::MAPS_API_KEY secret이 없어 지도 배경이 표시되지 않습니다 (기록 기능은 동작)."
          fi

      - name: Build debug and release APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log

      # 빌드가 실패하면 컴파일 오류를 요약해 실행 화면(Annotations)에 보여준다
      - name: Show build errors
        if: failure()
        run: |
          grep -iE "^e: |error:|What went wrong|lint-results" -A2 build.log | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Show lint report
        if: failure()
        run: |
          for f in $(find app/build -name "lint-results*.txt" 2>/dev/null); do
            grep -E ": (Error|Warning):" "$f" | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          done

      # 만들어진 APK의 서명이 등록한 SHA-1과 같은지 확인한다 (다르면 빌드 실패)
      - name: Verify signing SHA-1
        if: env.SIGNED_WITH_DOT_KEY == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for APK in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "SHA-1 digest" | awk '{print $NF}' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
            echo "$APK -> $ACTUAL"
            if [ "$ACTUAL" != "$EXPECTED_SHA1" ]; then
              echo "::error::$APK SHA-1 ($ACTUAL) does not match the registered SHA-1"
              exit 1
            fi
          done

      - name: Name release APK
        id: apk
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/DotTrace-${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          ls -l out
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dottrace-release-apk
          path: out/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dottrace-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Actions 탭에서 "Run workflow"로 직접 실행하거나 v* 태그를 올리면
      # Releases 페이지에 릴리즈 APK를 올린다 (휴대폰에서 바로 받기 좋음)
      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}.{1}', steps.apk.outputs.version, github.run_number) }}
          name: DotTrace ${{ steps.apk.outputs.version }} (빌드 ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: out/*.apk
          generate_release_notes: true
